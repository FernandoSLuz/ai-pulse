name: Build Installer (debug)

# On-demand packaging build for iterating on the installers without cutting
# releases. Produces the NSIS .exe on Windows and AppImage + pacman on Linux.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install
        run: npm ci

      - name: Fetch the Electron binary
        run: npx install-electron

      - name: Build and package
        shell: bash
        run: |
          npm run build -w @ai-pulse/widget
          cd packages/widget
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx electron-builder --win --publish never
          else
            npx electron-builder --linux AppImage pacman --publish never
          fi
          ls -la release

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ai-pulse-${{ matrix.os }}
          path: |
            packages/widget/release/*.exe
            packages/widget/release/*.AppImage
            packages/widget/release/*.pacman
            packages/widget/release/latest*.yml
          if-no-files-found: error
