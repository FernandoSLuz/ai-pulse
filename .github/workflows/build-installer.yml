name: Build Installer (debug)

# On-demand packaging build for iterating on installers without cutting a
# release. This workflow never publishes a GitHub Release.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Install
        run: npm ci

      - name: Fetch the Electron binary
        run: npx install-electron

      - name: Build and package
        shell: bash
        run: |
          npm run build -w @ai-pulse/widget
          cd packages/widget
          if [ "${{ matrix.platform }}" = "win" ]; then
            npx electron-builder --win nsis --${{ matrix.arch }} --publish never
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
          else
            npx electron-builder --linux AppImage deb rpm pacman --${{ matrix.arch }} --publish never
          fi
          ls -la release

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ai-pulse-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            packages/widget/release/*.exe
            packages/widget/release/*.AppImage
            packages/widget/release/*.dmg
            packages/widget/release/*.zip
            packages/widget/release/*.deb
            packages/widget/release/*.rpm
            packages/widget/release/*.pacman
            packages/widget/release/latest-linux.yml
            packages/widget/release/latest.yml
          if-no-files-found: error
