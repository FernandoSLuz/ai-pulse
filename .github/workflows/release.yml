name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch the Electron binary
        run: npx install-electron

      # better-sqlite3 >= 13 ships one Node-API prebuild per platform, so there
      # is no Electron-ABI rebuild step anymore — just prove it loads.
      - name: Smoke-test better-sqlite3 under Electron
        shell: bash
        run: ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron.exe -e "new (require('better-sqlite3'))(':memory:').close(); console.log('better-sqlite3 OK under electron', process.versions.electron);"

      - name: Build and package (NSIS)
        shell: bash
        run: |
          npm run build -w @ai-pulse/widget
          cd packages/widget && npx electron-builder --win --publish never

      - name: Publish GitHub Release (Windows assets)
        uses: softprops/action-gh-release@v2
        with:
          # Tags containing "-rc" (e.g. v1.2.0-rc.1) publish as a prerelease.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            packages/widget/release/*.exe
            packages/widget/release/*.blockmap
            packages/widget/release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-packages:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # fpm's pacman writer shells out to bsdtar, which the runner image lacks.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install
        run: npm ci

      - name: Fetch the Electron binary
        run: npx install-electron

      - name: Smoke-test better-sqlite3 under Electron
        run: ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron -e "new (require('better-sqlite3'))(':memory:').close(); console.log('better-sqlite3 OK under electron', process.versions.electron);"

      # pacman turns 1.2.0-rc.1 into pkgver 1.2.0_rc.1, which vercmp sorts ABOVE
      # the final 1.2.0 — so release candidates ship as AppImage only.
      - name: Build and package (AppImage, plus pacman for final releases)
        run: |
          npm run build -w @ai-pulse/widget
          TARGETS="AppImage"
          case "${GITHUB_REF_NAME}" in *-rc*) ;; *) TARGETS="AppImage pacman" ;; esac
          echo "targets: $TARGETS"
          cd packages/widget && npx electron-builder --linux $TARGETS --publish never
          ls -la release

      - name: Publish GitHub Release (Linux assets)
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            packages/widget/release/*.AppImage
            packages/widget/release/*.pacman
            packages/widget/release/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
