appId: com.aipulse.desktop
productName: AI Pulse
copyright: © 2026 Fernando Luz

# electron is hoisted to the repo-root node_modules by npm workspaces, so
# electron-builder (run from packages/widget) can't auto-detect the version.
# Pin it explicitly; electron-builder fetches the matching dist for packaging.
electronVersion: 43.5.1

directories:
  output: release
  buildResources: build

# asar disabled so the supervised server child resolves its externals
# (better-sqlite3, node-notifier) via normal node_modules resolution.
asar: false

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

# better-sqlite3 >= 13 is a Node-API addon whose prebuilt binary loads under
# Node and Electron alike, so no per-runtime rebuild is needed anywhere.
npmRebuild: false
nodeGypRebuild: false

win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI Pulse
  runAfterFinish: true
  # Never wipe userData (config.json with API keys) on uninstall/update.
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
    - pacman
  # Also the .desktop file name and StartupWMClass; must match the
  # app.setDesktopName("ai-pulse.desktop") call in main.ts (Wayland app_id).
  executableName: ai-pulse
  icon: build/icon.png
  category: Utility
  synopsis: Your personal AI model radar
  # No spaces: the artifact path ends up in Exec= lines and shell commands.
  artifactName: ai-pulse-${version}.${ext}
  desktop:
    entry:
      Name: AI Pulse
      StartupWMClass: ai-pulse

pacman:
  packageName: ai-pulse
  # electron-builder's defaults include libappindicator-gtk3 and http-parser,
  # which do not exist in the Arch repositories; Electron >= 22 speaks
  # StatusNotifierItem over D-Bus directly and needs no appindicator library.
  depends:
    - c-ares
    - ffmpeg
    - gtk3
    - libevent
    - libvpx
    - libxslt
    - libxss
    - minizip
    - nss
    - re2
    - snappy
    - libnotify

# Register the aipulse:// deep link (NSIS registry on Windows; MimeType
# x-scheme-handler/aipulse in the Linux .desktop entry).
protocols:
  - name: AI Pulse
    schemes:
      - aipulse

# Update feed for electron-updater (latest.yml on Windows, latest-linux.yml on Linux).
publish:
  provider: github
  owner: FernandoSLuz
  repo: ai-pulse
